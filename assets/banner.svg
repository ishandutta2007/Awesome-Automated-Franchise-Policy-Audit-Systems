<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="radialCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radialPurple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.5"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#9333ea" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseBadge {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @keyframes gridFade {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.25; }
      }

      .bg-grid {
        animation: gridFade 8s ease-in-out infinite;
      }
      .anim-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-card-3 {
        animation: floatSlow 8s ease-in-out infinite 1s;
        transform-origin: center;
      }
      .pulse-line {
        stroke-dasharray: 60 120;
        animation: pulseBeam 5s linear infinite;
      }
      .live-dot {
        animation: pulseBadge 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background layer -->
  <rect width="1280" height="400" fill="url(#bgGradient)"/>
  <rect width="1280" height="400" fill="url(#radialCyan)"/>
  <rect width="1280" height="400" fill="url(#radialPurple)"/>

  <!-- 2. Tech Grid Pattern in Background -->
  <g class="bg-grid" stroke="#38bdf8" stroke-width="0.8">
    <line x1="0" y1="80" x2="1280" y2="80" stroke-dasharray="4 8"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke-dasharray="4 8"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke-dasharray="4 8"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke-dasharray="4 8"/>
    <line x1="160" y1="0" x2="160" y2="400" stroke-dasharray="4 8"/>
    <line x1="320" y1="0" x2="320" y2="400" stroke-dasharray="4 8"/>
    <line x1="480" y1="0" x2="480" y2="400" stroke-dasharray="4 8"/>
    <line x1="640" y1="0" x2="640" y2="400" stroke-dasharray="4 8"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke-dasharray="4 8"/>
    <line x1="960" y1="0" x2="960" y2="400" stroke-dasharray="4 8"/>
    <line x1="1120" y1="0" x2="1120" y2="400" stroke-dasharray="4 8"/>
  </g>

  <!-- 3. Dynamic Animated Audit Connection Lines (Background Behind Cards) -->
  <g fill="none">
    <path d="M 80,310 Q 300,340 500,310 T 920,290" stroke="#38bdf8" stroke-width="1.8" class="pulse-line"/>
    <path d="M 1180,90 Q 950,50 720,80 T 300,90" stroke="#a855f7" stroke-width="1.8" class="pulse-line"/>
  </g>

  <!-- 4. Dynamic Side Floating Indicator Cards (Placed strategically so they NEVER overlap title/subtitle) -->
  <!-- Top Left Dynamic Pill -->
  <g class="anim-card-1" transform="translate(60, 45)">
    <rect width="210" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" filter="url(#glowCyan)"/>
    <circle cx="22" cy="21" r="6" fill="#10b981" class="live-dot"/>
    <text x="38" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
      AI PHOTO AUDIT: ACTIVE
    </text>
  </g>

  <!-- Top Right Dynamic Pill -->
  <g class="anim-card-2" transform="translate(980, 45)">
    <rect width="240" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" filter="url(#glowPurple)"/>
    <circle cx="22" cy="21" r="6" fill="#a855f7" class="live-dot"/>
    <text x="38" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
      LEDGER POSTURE: VERIFIED
    </text>
  </g>

  <!-- Bottom Left Dynamic Mini Metric -->
  <g class="anim-card-2" transform="translate(60, 315)">
    <rect width="220" height="50" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="18" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-transform="uppercase">
      Store Compliance Rate
    </text>
    <text x="18" y="42" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">
      99.4% Verified
    </text>
  </g>

  <!-- Bottom Right Dynamic Mini Metric -->
  <g class="anim-card-3" transform="translate(1000, 315)">
    <rect width="220" height="50" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="18" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-transform="uppercase">
      Automated Audit Pipeline
    </text>
    <text x="18" y="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">
      Zero-Tamper Ledger
    </text>
  </g>

  <!-- 5. MAIN FOREGROUND: TITLE & SUBTITLE (Guaranteed 100% Foreground Visibility) -->
  <g id="foreground-content" filter="url(#shadow)">
    <!-- Category Badge -->
    <g transform="translate(640, 115)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="url(#cyanPurple)" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
        ENTERPRISE COMPLIANCE &amp; QA
      </text>
    </g>

    <!-- Main Title -->
    <text x="640" y="185" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
      Automated Franchise Policy Audit Systems
    </text>

    <!-- Gradient Accent Underline -->
    <rect x="420" y="206" width="440" height="4" rx="2" fill="url(#cyanPurple)"/>

    <!-- Subtitle Line 1 -->
    <text x="640" y="242" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
      Curated Landscape of SaaS Platforms, Open-Source Repositories &amp; AI Inspection Engines
    </text>

    <!-- Subtitle Line 2 (Tags) -->
    <text x="640" y="274" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.8">
      STORE-LEVEL COMPLIANCE • AI PHOTO AUDITING • BRAND STANDARDS • TAMPER-PROOF LEDGERS
    </text>
  </g>
</svg>
